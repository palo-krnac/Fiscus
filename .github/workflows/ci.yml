name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go – testy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Závislosti (SQLite ovládač)
        run: |
          go get modernc.org/sqlite@latest
          go mod tidy
      - name: go vet
        run: go vet ./... && go vet -tags sqlite ./...
      - name: Testy jadra (bez databázy)
        run: go test -race ./...
      - name: Testy so skutočnou SQLite
        run: go test -race -tags sqlite ./...

  frontend:
    name: Frontend – testy a build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  site:
    name: Web fiskus.sk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/check.mjs
