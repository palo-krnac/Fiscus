name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go – testy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Závislosti (SQLite ovládač)
        run: |
          go get modernc.org/sqlite@latest
          go mod tidy
      - name: go vet
        run: go vet ./... && go vet -tags sqlite ./...
      - name: Testy jadra (bez databázy)
        run: go test -race ./...
      - name: Testy so skutočnou SQLite
        run: go test -race -tags sqlite ./...

  windows:
    name: Go – Windows (ikona, aplikácia)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./internal/tray/ ./internal/desktop/ ./cmd/fiskus-mcp/
      # veľkosti štruktúr Win32 a spúšťač aplikácie na skutočnom Windows
      # výpis testov sa v logoch nedá vždy pozrieť, chyby idú aj do anotácií
      - shell: bash
        run: |
          set -o pipefail
          go test ./internal/tray/ ./internal/desktop/ ./cmd/fiskus-mcp/ 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+|^panic|FAIL\s' test.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

  frontend:
    name: Frontend – testy a build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  site:
    name: Web fiskus.sk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/check.mjs
