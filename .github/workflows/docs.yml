name: Dokumentácia

on:
  pull_request:
    paths: ['docs/**', 'mkdocs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml']

permissions:
  contents: read

jobs:
  mkdocs:
    name: Dokumentácia – MkDocs (dialekt Sourcebook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
