name: Release

# Značka verzie (git tag v0.1.0 && git push --tags) zostaví inštalátory
# a zverejní ich v GitHub Release. Pri zmene balenia v pull requeste sa
# inštalátory iba zostavia (kontrola), bez zverejnenia.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'backend/cmd/fiskus/**'
      - 'backend/internal/desktop/**'
  # Ručné spustenie: so zadanou značkou (napr. v0.1.0) zverejní vydanie
  # aj bez inštalátorov pre Windows a macOS, ak sa nezostavia.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Značka vydania (napr. v0.1.0); prázdna = iba zostaviť'
        required: false
        default: ''

permissions:
  contents: write

env:
  # v0.1.0 → 0.1.0; mimo značky 0.0.0-dev
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || 'v0.0.0-dev' }}

jobs:
  build:
    name: Binárky
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build --outDir ../backend/internal/web/dist --emptyOutDir

      - name: Go závislosti
        working-directory: backend
        run: |
          go get modernc.org/sqlite@latest
          go mod tidy

      - name: Ikona programu pre Windows
        working-directory: backend
        run: go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico ../packaging/icons/fiskus.ico -o cmd/fiskus/rsrc_windows_amd64.syso

      - name: Krížová kompilácia
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../dist
          flags="-s -w -X main.version=${VERSION}"
          for target in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -tags sqlite -trimpath -ldflags "$flags" \
              -o ../dist/fiskus-${os}-${arch}${ext} ./cmd/fiskus
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o ../dist/fiskus-mcp-${os}-${arch}${ext} ./cmd/fiskus-mcp
          done
          # aplikácia pre inštalátor: bez okna konzoly (denník je v %APPDATA%\Fiskus)
          GOOS=windows GOARCH=amd64 go build -tags sqlite -trimpath -ldflags "$flags -H windowsgui" \
            -o ../dist/fiskus-windows-amd64-app.exe ./cmd/fiskus
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: dist/

  linux:
    name: Balíky .deb a .rpm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Balíky
        run: |
          mkdir -p out
          v=${VERSION#v}
          for arch in amd64 arm64; do
            # konfigurácia s doplnenou verziou a architektúrou (nezávisí od rozbaľovania premenných v nfpm)
            sed -e "s/__VERSION__/$v/g" -e "s/__ARCH__/$arch/g" packaging/linux/nfpm.yaml > nfpm-$arch.yaml
            for fmt in deb rpm; do
              if ! nfpm package --config nfpm-$arch.yaml --packager $fmt --target out/ > nfpm.log 2>&1; then
                cat nfpm.log
                echo "::error title=nfpm $fmt $arch::$(tr '\n' ' ' < nfpm.log | cut -c1-500)"
                exit 1
              fi
            done
          done
          ls -la out
      - name: Kontrola balíka
        run: |
          deb=$(ls out/*amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/fiskus$|fiskus.desktop|fiskus.png'
          desktop-file-validate packaging/linux/fiskus.desktop || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  windows:
    name: Inštalátor pre Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: dist
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Inštalátor
        shell: pwsh
        run: |
          $v = $env:VERSION.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\fiskus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item dist\fiskus-*-windows-setup.exe out\
          Get-ChildItem out
      - name: Kontrola inštalácie
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out\fiskus-*-windows-setup.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!desktopicon'
          $exe = "$env:LOCALAPPDATA\Programs\Fiskus\fiskus-cli.exe"
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Fiskus\fiskus.exe")) { throw 'fiskus.exe chýba' }
          $out = & $exe -version
          if ($out -notmatch 'Fiskus') { throw "neočakávaný výstup: $out" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  macos:
    name: Aplikácia pre macOS
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: dist
      - name: Fiškus.app a .dmg
        run: |
          mkdir -p out
          packaging/macos/build-app.sh "${VERSION#v}" dist
          mv dist/fiskus-*-macos.dmg out/
          hdiutil imageinfo out/*.dmg | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  release:
    name: GitHub Release
    # vydanie aj keď inštalátor pre Windows alebo macOS zlyhal (binárky
    # a balíky pre Linux stačia); pri značke v git musia prejsť všetky
    if: >-
      always() && needs.build.result == 'success' && needs.linux.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.macos.result == 'success' ||
       github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: [build, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Súbory na stiahnutie
        run: |
          mkdir -p release
          cp art/linux/* release/
          for d in windows macos; do
            if [ -d "art/$d" ]; then cp art/$d/* release/; fi
          done
          # samostatné binárky (server, príkazový riadok) s verziou v názve
          for f in art/bin/fiskus-*; do
            name=$(basename "$f")
            case "$name" in
              # aplikácia bez okna konzoly: spustí sa dvojklikom aj bez inštalátora
              *-app.exe) cp "$f" "release/fiskus-${VERSION}-windows-bez-instalacie.exe" ;;
              fiskus-mcp-*) cp "$f" "release/fiskus-mcp-${VERSION}-${name#fiskus-mcp-}" ;;
              *) cp "$f" "release/fiskus-${VERSION}-${name#fiskus-}" ;;
            esac
          done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
